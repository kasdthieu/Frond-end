<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Lịch Học</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="asset/css/styles.css">
</head>
<body>
    <!-- Thanh điều hướng -->
    <nav class="navbar">
        <div class="logo">Quản lý sinh viên</div>
        <ul class="nav-links">
            <li><a href="profile.html">Thông tin sinh viên</a></li>
            <li><a href="grades.html">Xem điểm</a></li>
            <li><a href="register.html">Đăng ký môn học</a></li>
            <li><a href="schedule.html">Lên lịch học</a></li>
            <li><a href="schedule-view.html" class="active">Xem lịch học</a></li>
            <li><a href="index.html" class="logout">Đăng xuất</a></li>
        </ul>
    </nav>

    <!-- Nội dung trang xem lịch học -->
    <div class="container">
        <div class="schedule-view">
            <h2>Thời Khóa Biểu</h2>
            <table>
                <thead>
                    <tr>
                        <th>Khung Giờ</th>
                        <th>Thứ 2</th>
                        <th>Thứ 3</th>
                        <th>Thứ 4</th>
                        <th>Thứ 5</th>
                        <th>Thứ 6</th>
                        <th>Thứ 7</th>
                    </tr>
                </thead>
                <tbody id="scheduleTableBody">
                    <!-- Dữ liệu sẽ được thêm vào đây thông qua JavaScript -->
                </tbody>
            </table>            
        </div>
    </div>
    <footer class="footer">
        <p>Copyright @ 2024 Nguyễn Tiến Thiệu</p>
    </footer>

    <script>
 window.onload = async () => {
    const studentId = sessionStorage.getItem('student_id');
    
    if (!studentId) {
        alert('Bạn cần đăng nhập để xem thông tin.');
        window.location.href = 'index.html';
        return;
    }

    try {
        const apiUrl = `http://localhost:3000/shedule`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
            throw new Error(`Error: ${response.status} ${response.statusText}`);
        }
        
        const data = await response.json();
        
        if (!Array.isArray(data) || data.length === 0) {
            console.warn('No schedule data available.');
            return;
        }

        const scheduleTableBody = document.getElementById('scheduleTableBody');
        scheduleTableBody.innerHTML = ''; // Xóa dữ liệu cũ trong bảng nếu có

        const timeSlots = ["7-9h", "9-11h", "13h-15h", "15h-17h", "17h-19h"];
        const daysOfWeek = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];

        // Tạo các hàng cho khung giờ cố định
        timeSlots.forEach(timeSlot => {
            const row = document.createElement('tr');
            const timeSlotCell = document.createElement('td');
            timeSlotCell.textContent = timeSlot;
            row.appendChild(timeSlotCell);

            // Duyệt qua từng ngày trong tuần và điền dữ liệu
            daysOfWeek.forEach(day => {
                const cell = document.createElement('td');
                const classInfo = data.find(cls => cls.day === day && cls.time === timeSlot);

                if (classInfo) {
                    cell.innerHTML = `
                        <strong>${classInfo.name}</strong><br>
                        Mã: ${classInfo.code}<br>
                        Nhóm: ${classInfo.group}<br>
                        Phòng: ${classInfo.classroom}
                    `;
                } else {
                    cell.textContent = '-';
                    cell.classList.add('no-class');
                }

                row.appendChild(cell);
            });

            scheduleTableBody.appendChild(row);
        });
    } catch (error) {
        console.error('Error loading schedule data:', error);
    }
};

    </script>
    
</body>
</html>
